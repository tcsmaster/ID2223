[project]
name = "lab2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12 ,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "asyncio>=4.0.0",
    "datasets[audio]>=4.5.0",
    "dill>=0.4.0",
    "evaluate>=0.4.6",
    "huggingface-hub>=1.4.1",
    "jiwer>=4.0.0",
    "librosa>=0.11.0",
    "modal>=1.3.3",
    "pandas<=2.3.1,>=2.2.2", # datasets.Audio is bugged with pandas >=3.0
    "python-dotenv>=1.2.2",
    "torch<=2.10.0",
    "torchaudio>=2.10.0,<2.11.0",
    "transformers>=5.2.0",
    "wandb>=0.27.0",
]

[tool.uv.sources]
torch = [{ index =  'torch-128'}]

[[tool.uv.index]]
name='torch-128'
url='https://download.pytorch.org/whl/cu128'
explicit=true

[[tool.uv.index]]
name='torch-cpu'
url='https://download.pytorch.org/whl/cpu'
explicit=true
